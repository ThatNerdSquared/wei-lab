[tool.basedpyright]
allowedUntypedLibraries = [ "matplotlib" ]
reportUnnecessaryTypeIgnoreComment = true
reportIncompatibleUnannotatedOverride = true
reportUnannotatedClassAttribute = false
exclude = ["**/__pycache__", "**/.*", "**/*.ipynb"]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["F", "E4", "E5", "E9", "I", "RUF013", "RUF027", "RUF100", "RUF102"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
# as recommended by pytest docs:
# https://docs.pytest.org/en/stable/explanation/goodpractices.html#which-import-mode
addopts = [
    "--import-mode=importlib",
]
