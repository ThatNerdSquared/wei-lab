name: wei-lab ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-all:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        check-latest: true
    - name: install deps
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        make deps
        pip3 install basedpyright
    - name: check formatting
      run: |
        source .venv/bin/activate
        make fmt-dry
    - name: check linting
      run: |
        source .venv/bin/activate
        make lint
    - name: check types
      run: |
        source .venv/bin/activate
        make typecheck
    - name: run tests
      run: |
        source .venv/bin/activate
        make vtest
