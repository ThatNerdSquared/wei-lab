name: wei-lab ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-all:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        check-latest: true
    - name: install deps
      run: |
        make deps
        pip3 install basedpyright
    - name: check formatting
      run: make fmt-dry
    - name: check linting
      run: make lint
    - name: check types
      run: make typecheck
    - name: run tests
      run: make vtest
